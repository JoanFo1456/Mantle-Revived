plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'io.freefair.lombok' version '8.14'
}

repositories {
    mavenCentral()
    maven {
        // Our maven
        name "Prog's Maven"
        url 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        // JEI
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        // for Yarn2MCP
        name "yarn2mcp"
        url "https://maven.tterrag.com/"
    }
    // If you have mod jar dependencies in ./libs, you can declare them as a repository like so:
    // flatDir {
    //     dir 'libs'
    // }
}

group = 'slimeknights.mantle'
base {
    archivesName = 'MantleRevived'
}
// MC 26.1.2 decompiled source uses Java 25 PREVIEW features (ScopedValue, flexible constructors),
// so the Minecraft recompile REQUIRES JDK 25 — JDK 24 cannot build it. This forces JDK 25 even
// though lombok's JDK 25 support is fragile (see lombok version pin below).
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// The io.freefair.lombok 8.6 plugin pins lombok 1.18.30, which predates JDK 24. Override to the
// latest lombok so its annotation processor runs under the JDK 24 toolchain.
lombok {
    version = '1.18.46'
}

// sets version to the slimeKnights version format
task buildInfo {
    try {
        def cmd = "git rev-parse --short HEAD"
        def proc = cmd.execute()
        proc.waitFor()
        if (proc.exitValue() == 0) {
            ext.revision = proc.text.trim()
        } else {
            ext.revision = "GITBORK"
        }
    } catch (all) {
        ext.revision = "gitgud"
    }

    if (System.getenv().BUILD_NUMBER != null) {
        ext.buildNum = "${System.getenv().BUILD_NUMBER}"
    } else {
        ext.buildNum = "DEV.${project.buildInfo.revision}"
    }
}
ext.artifact_version = 'NFG'
if (System.getenv().ARTIFACT_VERSION == null) {
    artifact_version = "${mod_version}.${project.buildInfo.buildNum}"
}
if (System.getenv().ARTIFACT_VERSION != null) {
    artifact_version = "${system.getenv().ARTIFACT_VERSION}"
}

version = "${minecraft_version}-${artifact_version}"
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

sourceSets {
    main {
        resources {
            srcDirs "src/generated/resources"
            //But exclude the cache of the generated data from what gets built
            exclude '.cache'
        }
    }
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    // applies to all the run configs below
    configureEach {
        workingDirectory project.file('run')

        // Recommended logging data for a userdev environment
        systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP,CORE'

        // Recommended logging level for the console
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
    }

    server {
        argument '--nogui'
    }

    // NeoForge 26.1.x split datagen into clientData/serverData; 'data' run type no longer exists.
    // Temporarily disabled during the port; re-add clientData/serverData once compiling.
    // data {
    //     arguments.addAll '--mod', 'mantle', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    // }
}

configurations {
    deployerJars
}
               
dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
        'version': artifact_version,
        'loader_range': loader_range,
        'minecraft_range': minecraft_range,
        'neo_range': neo_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "Mantle",
                "Specification-Vendor"    : "Slime Knights",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Slime Knights",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}

sourcesJar {
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

artifacts {
    archives sourcesJar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }

    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

// Ensure the lombok annotation processor actually runs for the mod sources. On this Gradle 9 /
// NeoGradle setup the compileJava task is left with an empty annotationProcessorPath, which
// silently disables ALL lombok codegen (@RequiredArgsConstructor/@Getter/@Log4j2 generate
// nothing). Set it after NeoGradle finishes configuring, scoped to compileJava only so the
// Minecraft recompile task (neoFormRecompile) is untouched.
afterEvaluate {
    tasks.named('compileJava').configure {
        // NeoGradle ("Enabling dist annotations on PMJ") plus the JDK 23+ change to processor
        // discovery leave lombok silently no-processing on JDK 25. Force it explicitly in doFirst
        // (applied last, right before javac): re-assert the processor path AND name lombok as an
        // explicit -processor (bypasses discovery), the approach proven to work on this setup.
        doFirst {
            def ap = configurations.findByName('annotationProcessor')
            if (ap != null && !ap.isEmpty()) {
                options.annotationProcessorPath = ap
            }
            // strip any -proc* flag and any pre-existing '-processor <x>' pair, then add lombok
            def cleaned = []
            def cur = options.compilerArgs
            for (int i = 0; i < cur.size(); i++) {
                if (cur[i] == '-processor') { i++; continue }
                if (cur[i].startsWith('-proc')) { continue }
                cleaned << cur[i]
            }
            cleaned += ['-processor', 'lombok.launch.AnnotationProcessorHider$AnnotationProcessor']
            options.compilerArgs = cleaned
        }
    }
}
